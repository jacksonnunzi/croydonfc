<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Croydon FC - Content Manager</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      #gate {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0b2545 0%, #0d1b3e 100%);
        color: #fff;
      }
      #gate .box {
        text-align: center;
        width: 100%;
        max-width: 340px;
        padding: 2rem;
      }
      #gate h1 {
        font-size: 1.4rem;
        font-weight: 700;
        letter-spacing: 0.15em;
        text-transform: uppercase;
        margin-bottom: 0.25rem;
      }
      #gate .sub { font-size: 0.75rem; opacity: 0.6; margin-bottom: 2rem; }
      #gate input {
        width: 100%;
        padding: 0.75rem 1rem;
        border: 1px solid rgba(255,255,255,0.2);
        border-radius: 6px;
        background: rgba(255,255,255,0.1);
        color: #fff;
        font-size: 1rem;
        outline: none;
      }
      #gate input::placeholder { color: rgba(255,255,255,0.4); }
      #gate input:focus { border-color: rgba(255,255,255,0.5); }
      #gate button {
        width: 100%;
        margin-top: 0.75rem;
        padding: 0.75rem;
        border: none;
        border-radius: 6px;
        background: #fff;
        color: #0b2545;
        font-weight: 600;
        font-size: 0.95rem;
        cursor: pointer;
      }
      #gate button:hover { opacity: 0.9; }
      #gate .err { color: #f87171; font-size: 0.8rem; margin-top: 0.75rem; min-height: 1.2em; }
      #gate .home-link { display: inline-block; margin-top: 1.5rem; font-size: 0.8rem; color: rgba(255,255,255,0.5); text-decoration: none; }
      #gate .home-link:hover { color: #fff; }
    </style>
  </head>
  <body>
    <div id="gate">
      <div class="box">
        <h1>Croydon FC</h1>
        <div class="sub">Content Manager</div>
        <form id="login-form">
          <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus />
          <button type="submit">Log in</button>
          <div class="err" id="err"></div>
        </form>
        <a href="/" class="home-link">&larr; Back to website</a>
      </div>
    </div>

    <script>
      // Password hash (SHA-256 of the plaintext password).
      // To change the password, run in a browser console:
      //   crypto.subtle.digest('SHA-256', new TextEncoder().encode('YOUR_NEW_PASSWORD'))
      //     .then(b => console.log(Array.from(new Uint8Array(b)).map(x => x.toString(16).padStart(2,'0')).join('')))
      // Then paste the hex string below.
      var HASH = '64d132133a93a9bd9710100109df3fd5bf18eebdae2db060f294d0928ef9ea77';

      document.getElementById('login-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        var pw = document.getElementById('pw').value;
        var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
        var hex = Array.from(new Uint8Array(buf)).map(function (x) { return x.toString(16).padStart(2, '0'); }).join('');
        if (hex === HASH) {
          sessionStorage.setItem('cfc-admin', '1');
          loadCMS();
        } else {
          document.getElementById('err').textContent = 'Wrong password';
        }
      });

      function loadCMS() {
        document.getElementById('gate').style.display = 'none';
        var s = document.createElement('script');
        s.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
        document.body.appendChild(s);
      }

      // Stay logged in for the session
      if (sessionStorage.getItem('cfc-admin') === '1') {
        loadCMS();
      }
    </script>
  </body>
</html>
