<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <title>Croydon FC - Content Manager</title>
    <link rel="icon" type="image/png" href="/favicon.png" />
    <style>
      *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
      body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', sans-serif; }
      .auth-screen {
        min-height: 100vh;
        display: flex;
        align-items: center;
        justify-content: center;
        background: linear-gradient(135deg, #0b2545 0%, #0d1b3e 100%);
        color: #fff;
      }
      .auth-screen .box { text-align: center; width: 100%; max-width: 340px; padding: 2rem; }
      .auth-screen h1 { font-size: 1.4rem; font-weight: 700; letter-spacing: 0.15em; text-transform: uppercase; margin-bottom: 0.25rem; }
      .auth-screen .sub { font-size: 0.75rem; opacity: 0.6; margin-bottom: 2rem; }
      .auth-screen input { width: 100%; padding: 0.75rem 1rem; border: 1px solid rgba(255,255,255,0.2); border-radius: 6px; background: rgba(255,255,255,0.1); color: #fff; font-size: 1rem; outline: none; }
      .auth-screen input::placeholder { color: rgba(255,255,255,0.4); }
      .auth-screen input:focus { border-color: rgba(255,255,255,0.5); }
      .auth-screen button { width: 100%; margin-top: 0.75rem; padding: 0.75rem; border: none; border-radius: 6px; background: #fff; color: #0b2545; font-weight: 600; font-size: 0.95rem; cursor: pointer; }
      .auth-screen button:hover { opacity: 0.9; }
      .auth-screen button:disabled { opacity: 0.5; cursor: not-allowed; }
      .auth-screen .err { color: #f87171; font-size: 0.8rem; margin-top: 0.75rem; min-height: 1.2em; }
      .auth-screen .home-link { display: inline-block; margin-top: 1.5rem; font-size: 0.8rem; color: rgba(255,255,255,0.5); text-decoration: none; }
      .auth-screen .home-link:hover { color: #fff; }
    </style>
  </head>
  <body>
    <div id="gate" class="auth-screen">
      <div class="box">
        <h1>Croydon FC</h1>
        <div class="sub">Content Manager</div>
        <form id="login-form">
          <input type="password" id="pw" placeholder="Password" autocomplete="current-password" autofocus />
          <button type="submit" id="btn">Log in</button>
          <div class="err" id="err"></div>
        </form>
        <a href="/" class="home-link">&larr; Back to website</a>
      </div>
    </div>

    <script>
      var AUTH_URL = 'https://cms-auth.jacksonnunziante09.workers.dev/auth';

      document.getElementById('login-form').addEventListener('submit', async function (e) {
        e.preventDefault();
        var btn = document.getElementById('btn');
        var errEl = document.getElementById('err');
        btn.disabled = true;
        btn.textContent = 'Logging in...';
        errEl.textContent = '';

        try {
          var pw = document.getElementById('pw').value;
          var buf = await crypto.subtle.digest('SHA-256', new TextEncoder().encode(pw));
          var hex = Array.from(new Uint8Array(buf)).map(function (x) { return x.toString(16).padStart(2, '0'); }).join('');

          var res = await fetch(AUTH_URL, {
            method: 'POST',
            headers: { 'Content-Type': 'application/json' },
            body: JSON.stringify({ hash: hex })
          });
          var data = await res.json();

          if (data.token) {
            loadCMS(data.token);
          } else {
            errEl.textContent = 'Wrong password';
            btn.disabled = false;
            btn.textContent = 'Log in';
          }
        } catch (err) {
          errEl.textContent = 'Connection error. Try again.';
          btn.disabled = false;
          btn.textContent = 'Log in';
        }
      });

      function loadCMS(token) {
        document.getElementById('gate').style.display = 'none';
        var user = JSON.stringify({ token: token, name: 'Editor', login: 'editor', avatar_url: '', backendName: 'github' });
        localStorage.setItem('netlify-cms-user', user);
        localStorage.setItem('decap-cms-user', user);
        window.CMS_MANUAL_INIT = true;
        var s = document.createElement('script');
        s.src = 'https://unpkg.com/decap-cms@^3.0.0/dist/decap-cms.js';
        s.onload = function () {
          var init = window.initCMS || (window.CMS && window.CMS.init);
          if (init) init({ config: { backend: { name: 'github', repo: 'jacksonnunzi/croydonfc', branch: 'main' } } });
        };
        document.body.appendChild(s);
      }
    </script>
  </body>
</html>
