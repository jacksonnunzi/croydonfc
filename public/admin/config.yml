backend:
  name: github
  repo: jacksonnunzi/croydonfc
  branch: main
  base_url: https://cms-auth.jacksonnunziante09.workers.dev
media_folder: "public/images/uploads"
public_folder: "/images/uploads"
site_url: https://croydonfootballclub.com.au
display_url: https://croydonfootballclub.com.au
logo_url: /favicon.svg

collections:
  - name: "news"
    label: "News"
    folder: "src/content/news"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "Author", name: "author", widget: "string", default: "Croydon FC" }
      - label: "Category"
        name: "category"
        widget: "select"
        default: "Club News"
        options:
          - "Match Report"
          - "Club News"
          - "Player Profile"
          - "Announcement"
          - "Community"
      - { label: "Summary", name: "summary", widget: "text", required: false }
      - { label: "Hero image", name: "hero", widget: "image", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown" }

  - name: "players"
    label: "Squad"
    folder: "src/content/players"
    create: true
    slug: "{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Name", name: "name", widget: "string" }
      - label: "Code"
        name: "code"
        widget: "select"
        options: ["football", "netball"]
        default: "football"
      - { label: "Position", name: "position", widget: "string", required: false }
      - { label: "Squad number", name: "number", widget: "number", required: false, value_type: "int", min: 0, max: 99 }
      - { label: "Photo", name: "photo", widget: "image", required: false }
      - { label: "Joined", name: "joined", widget: "string", required: false }
      - label: "Stats"
        name: "stats"
        widget: "object"
        required: false
        fields:
          - { label: "Games", name: "games", widget: "number", default: 0, value_type: "int" }
          - { label: "Goals", name: "goals", widget: "number", default: 0, value_type: "int" }
      - { label: "Bio", name: "body", widget: "markdown" }

  - name: "events"
    label: "Events"
    label_singular: "Event"
    description: "Club events - presentation night, AGM, functions, training camps, etc."
    folder: "src/content/events"
    create: true
    slug: "{{year}}-{{month}}-{{day}}-{{slug}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - { label: "Title", name: "title", widget: "string" }
      - { label: "Start date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false }
      - { label: "End date", name: "endDate", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, required: false }
      - { label: "Time", name: "time", widget: "string", required: false, hint: "e.g. 7:00 PM" }
      - { label: "Location", name: "location", widget: "string", required: false }
      - label: "Category"
        name: "category"
        widget: "select"
        default: "Club Event"
        options:
          - "Match Day"
          - "Function"
          - "Training"
          - "Fundraiser"
          - "AGM"
          - "Community"
          - "Club Event"
      - { label: "Summary", name: "summary", widget: "text", required: false }
      - { label: "Hero image", name: "hero", widget: "image", required: false }
      - { label: "RSVP / tickets URL", name: "rsvpUrl", widget: "string", required: false }
      - { label: "Draft", name: "draft", widget: "boolean", default: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }

  - name: "team_selections"
    label: "Team selections"
    label_singular: "Team selection"
    description: "Upload this week's team sheet photo for Seniors, Reserves or U19.5."
    folder: "src/content/team_selections"
    create: true
    slug: "{{fields.team}}-{{year}}-{{month}}-{{day}}"
    extension: "md"
    format: "frontmatter"
    fields:
      - label: "Team"
        name: "team"
        widget: "select"
        options:
          - { label: "Seniors", value: "seniors" }
          - { label: "Reserves", value: "reserves" }
          - { label: "Under 19.5", value: "under-19-5" }
      - { label: "Round", name: "round", widget: "number", required: false, value_type: "int", min: 1, max: 22 }
      - { label: "Match date", name: "date", widget: "datetime", date_format: "YYYY-MM-DD", time_format: false, default: "" }
      - { label: "Team sheet photo", name: "photo", widget: "image" }
      - { label: "Notes (optional)", name: "notes", widget: "text", required: false }
      - { label: "Body", name: "body", widget: "markdown", required: false }
